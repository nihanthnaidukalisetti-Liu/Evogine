name: CI

# Lint (ruff) then test (pytest) on Python 3.12, for pushes to main and all
# pull requests. No secrets: the scaffold suite makes no live API calls.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Pytest
        run: pytest -q

  # The offline job above never installs docker-py, so the Docker-gated
  # probes skip there. This job runs the same suite where the daemon exists
  # (ubuntu-latest runners have Docker): the sandbox's isolation and
  # seccomp guarantees are enforced for real, not just locally.
  docker-gated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package with dev and docker dependencies
        run: pip install -e ".[dev,docker]"

      - name: Pytest with Docker probes active
        run: pytest -q
