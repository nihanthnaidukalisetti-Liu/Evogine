name: CI

# Quality gates for pushes to main and all pull requests: ruff lint, mypy
# strict over the package, pytest with a coverage floor on evogine.gates and
# evogine.engine, gitleaks secret scanning, a Docker-gated job that runs
# the same suite where the daemon exists (ubuntu-latest runners have Docker)
# so the sandbox's isolation and seccomp guarantees are enforced for real,
# not just locally, and a console job that runs the optional [console]
# extra's route suite with its own package coverage floor. The core jobs
# install only the core extras, so the core install gains no new runtime
# dependencies; optional-component code skips cleanly there and is tested
# in its own job. No secrets required by the suite: it makes no live API
# calls; nothing here needs a token. The gitleaks job runs the pinned
# release binary directly — the action variant calls the GitHub API to
# report findings, which fails with "Resource not accessible by" when the
# default token lacks those scopes; a raw binary scan needs no permissions
# and still scans the full history.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The console extra is installed here so strict mypy can resolve and
      # type the optional evogine.console package; type-time dependency,
      # not a new runtime dependency of the core install.
      - name: Install package with dev and console dependencies
        run: pip install -e ".[dev,console]"

      # Strictness lives in [tool.mypy] (pyproject), so this invocation is
      # exactly what a local `mypy src/evogine` runs.
      - name: Mypy (strict)
        run: mypy src/evogine

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      # Coverage floor on the two contract-bearing packages (gates, engine).
      # Measured at 98% at introduction; the 96% floor blocks meaningful
      # erosion without flaking on Docker-skipped probes (this job never
      # installs docker-py, so those probes skip cleanly). The console
      # tests skip the same way: this job installs no [console] extra, so
      # the core runtime dependency set is exercised dependency-clean.
      - name: Pytest with coverage floor on gates and engine
        env:
          # Property suites ride the ci profile (200 examples vs 30 locally);
          # the dev default stays for local runs.
          HYPOTHESIS_PROFILE: ci
        run: >
          pytest -q --cov=evogine.gates --cov=evogine.engine
          --cov-report=term-missing --cov-fail-under=96

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history so the scan covers every commit on push and PR
          # events, not just the checkout tip.
          fetch-depth: 0

      # Pinned v8.30.1 release binary (asset name per the release page).
      # `detect` scans the whole commit history with fetch-depth: 0 above and
      # exits nonzero when a rule fires, failing the job.
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --verbose --redact --no-banner

  # The offline job above never installs docker-py, so the Docker-gated
  # probes skip there. This job runs the same suite where the daemon exists:
  # the sandbox's isolation and seccomp guarantees are enforced for real,
  # not just locally.
  docker-gated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package with dev and docker dependencies
        run: pip install -e ".[dev,docker]"

      - name: Pytest with Docker probes active
        run: pytest -q

  # The console is optional transport behind the [console] extra: the core
  # jobs above never install it and the console tests skip there. This job
  # runs the console route/refusal/launch suite where the extra exists,
  # with the console package's own coverage floor.
  console:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package with dev and console dependencies
        run: pip install -e ".[dev,console]"

      # Measured at 96% at introduction; the 90% floor is the console
      # package's own requirement from the V3 verification matrix. The
      # console suites run together so the package floor covers the read
      # pages and the write path in one measurement.
      - name: Console route tests with package coverage floor
        run: >
          pytest tests/test_console.py tests/test_console_funnel.py tests/test_console_write.py -q
          --cov=evogine.console --cov-report=term-missing --cov-fail-under=90
