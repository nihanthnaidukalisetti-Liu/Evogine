[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evogine"
# Single version source: bump here only — tests/test_version_parity.py fails
# on drift between this field and the package __version__.
version = "4.0.0"
description = "Self-evolving agentic engine: git-backed learning, builder/verifier/reflector swarm, two objective gates, a decay-pressure benchmark, a localhost operator console, federated cross-project memory, and a git-native sync daemon."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Nihanth Naidu Kalisetti", email = "nihanthnaidu008@gmail.com" },
]
keywords = ["agentic", "self-evolving", "code-repair", "learning", "swarm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "anthropic",
    "pydantic>=2",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/nihanthnaidukalisetti-Liu/Evogine"
Repository = "https://github.com/nihanthnaidukalisetti-Liu/Evogine"
Changelog = "https://github.com/nihanthnaidukalisetti-Liu/Evogine/blob/main/CHANGELOG.md"

[project.optional-dependencies]
docker = [
    "docker>=7.1.0",
]
# The operator console (evogine.console) is transport, not core: FastAPI,
# uvicorn, and Jinja2 load only behind this extra so the core install and
# ordinary dependency resolution gain nothing.
console = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]
# The sync daemon (evogine.sync) is transport, not core: it hosts store
# repositories over git smart HTTP and serves the read/query API, loading
# FastAPI and uvicorn only behind this extra. No jinja2 — the daemon speaks
# JSON and git's own protocol, never HTML. The core install gains nothing.
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "hypothesis",
    "types-PyYAML",
    # starlette's TestClient (the console route tests) runs on httpx.
    "httpx",
]

[project.scripts]
evogine = "evogine.cli:main"
evogine-syncd = "evogine.sync.server:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# The Docker boundary deliberately catches broadly — every catch is converted
# to a typed SandboxError/SandboxUnavailable (fail-closed) or is an
# availability probe. Narrow catches are impossible without hard-importing
# docker-py, which must stay optional at runtime.
"src/evogine/sandbox/docker_runner.py" = ["BLE001", "S110"]
# The code gate's fail-closed contract is a deliberate catch-all: ANY crash or
# infrastructure failure must produce a rejection, never an acceptance.
"src/evogine/gates/code_gate.py" = ["BLE001"]
# The console tests skip the whole module when the optional [console] extra
# is absent (core CI jobs install only the core extras); the skip must run
# before the fastapi import, so module-level imports follow a statement by
# design and run for real in the dedicated console CI job.
"tests/test_console.py" = ["E402"]
"tests/test_console_funnel.py" = ["E402"]
# The write-path suite skips the same way (the optional [console] extra is
# absent in core CI jobs), so its imports follow the skip call by design.
"tests/test_console_write.py" = ["E402"]
# The sync-daemon suites skip the same way (the optional [server] extra is
# absent in core CI jobs); their fastapi/uvicorn imports follow the skip
# calls by design and run for real in the dedicated sync CI job.
"tests/test_sync_binding.py" = ["E402"]
"tests/test_sync_queries.py" = ["E402"]
"tests/test_sync_server.py" = ["E402"]
"tests/test_sync_transport.py" = ["E402"]

[tool.hatch.build.targets.wheel]
packages = ["src/evogine"]

[tool.mypy]
# Strict typing on the whole package — every module is a new V2 module, so
# there is no legacy surface to carve out. Config lives here (not in the CI
# invocation) so a local `mypy src/evogine` enforces exactly what CI does.
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# uvicorn ships no py.typed marker; the console calls only uvicorn.run with
# typed keyword arguments. Ignoring its missing stubs does not weaken
# strictness anywhere else.
module = "uvicorn"
ignore_missing_imports = true
