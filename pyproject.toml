[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evogine"
version = "0.1.0"
description = "Self-evolving agentic engine: git-backed learning, builder/verifier/reflector swarm, two objective gates, decay-pressure benchmark."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "hypothesis",
]

[project.scripts]
evogine = "evogine.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/evogine"]
